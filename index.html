<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محمدی اسپیک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0e1f;--deep:#141935;--mist:#e8ebff;--dim:#9aa1c9;--violet:#8b7bff;--mint:#5eead4;--rose:#ff6f9d;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--ink);color:var(--mist);overflow-x:hidden;line-height:1.7}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 50% 120%,#1d2250,var(--ink) 60%)}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--violet);top:-25vmax;right:-15vmax}
.aurora i:nth-child(2){background:#2aa6c9;bottom:-30vmax;left:-20vmax;animation-delay:-9s;opacity:.28}
.aurora i:nth-child(3){background:var(--mint);width:30vmax;height:30vmax;top:35%;left:35%;opacity:.12;animation-delay:-16s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
header.top{display:flex;align-items:center;gap:.7rem;padding:1.2rem 1.6rem}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.25rem}
.logo svg{width:30px;height:30px}
#status{margin-inline-start:auto;font-size:.85rem;color:var(--dim);display:flex;align-items:center;gap:.5rem}
#status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
main#home{max-width:980px;margin:0 auto;padding:2vh 1.4rem 3rem;display:grid;grid-template-columns:1.1fr 1fr;gap:2.2rem;align-items:start}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800;line-height:1.15;margin:2rem 0 1rem;letter-spacing:-.02em}
.hero p{color:var(--dim);max-width:30ch}
.wave{display:flex;gap:5px;align-items:center;height:44px;margin-top:1.8rem}
.wave b{width:5px;border-radius:5px;background:linear-gradient(var(--mint),var(--violet));animation:eq 1.3s ease-in-out infinite}
.wave b:nth-child(1){height:30%;animation-delay:-.1s}.wave b:nth-child(2){height:70%;animation-delay:-.5s}.wave b:nth-child(3){height:100%;animation-delay:-.3s}.wave b:nth-child(4){height:55%;animation-delay:-.8s}.wave b:nth-child(5){height:85%;animation-delay:-.2s}.wave b:nth-child(6){height:40%;animation-delay:-.6s}.wave b:nth-child(7){height:65%;animation-delay:-.4s}
@keyframes eq{50%{transform:scaleY(.35)}}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:1.6rem;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
form#join{display:grid;gap:.9rem}
label{font-size:.85rem;color:var(--dim)}
input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-top:.3rem;font-size:1rem}
input:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(139,123,255,.25)}
#go{border:0;border-radius:14px;padding:.9rem;font-weight:800;font-size:1.05rem;cursor:pointer;color:#0b0e1f;background:linear-gradient(120deg,var(--mint),var(--violet));transition:transform .15s,filter .15s}
#go:hover{transform:translateY(-2px);filter:brightness(1.08)}#go:disabled{opacity:.6}
h2{font-size:.95rem;font-weight:600;color:var(--dim);margin:1.5rem 0 .6rem}
#rooms{display:grid;gap:.5rem}
.room{display:flex;align-items:center;gap:.8rem;text-align:start;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem;cursor:pointer;transition:border-color .15s,background .15s}
.room:hover{border-color:var(--mint);background:rgba(94,234,212,.07)}
.rn{font-weight:600}.rm{color:var(--dim);font-size:.8rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc{background:var(--mint);color:#0b0e1f;border-radius:99px;min-width:1.7rem;text-align:center;font-weight:800;font-size:.85rem}
.empty{color:var(--dim);font-size:.9rem}
#call{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 1.2rem 1rem}
.bar{display:flex;align-items:center;gap:.8rem;padding:1rem .4rem}
.bar .rt{font-weight:800;font-size:1.15rem}.bar small{color:var(--dim)}
.pill{margin-inline-start:auto;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:.4rem 1rem;cursor:pointer;font-size:.9rem}
.pill:hover{border-color:var(--violet)}
.body{flex:1;min-height:0;display:flex;gap:1rem}
#grid{flex:1;display:flex;flex-wrap:wrap;gap:1.6rem;align-content:center;justify-content:center;padding:1rem}
.has-stage #grid{flex:0 0 190px;flex-direction:column;flex-wrap:nowrap;overflow:auto;align-content:flex-start;justify-content:flex-start;gap:.9rem}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:.8rem;overflow:auto}
#stage figure{flex:1;min-height:200px;background:#000;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;display:flex}
#stage video{width:100%;height:100%;object-fit:contain;background:#000}
#stage figcaption{position:absolute;top:.7rem;inset-inline-start:.7rem;background:rgba(11,14,31,.7);padding:.15rem .8rem;border-radius:99px;font-size:.8rem}
.tile{--lv:0;position:relative;display:grid;justify-items:center;gap:.6rem;width:130px}
.av{position:relative;width:96px;height:96px;display:grid;place-items:center}
.av b{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;font-weight:800;color:#0b0e1f;background:linear-gradient(135deg,var(--violet),var(--mint))}
.av i{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--mint);box-shadow:0 0 28px var(--mint);opacity:calc(var(--lv)*1.1);transform:scale(calc(.92 + var(--lv)*.22))}
.tile.speaking .av b{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--mint)}
.tile span{font-size:.92rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi{position:absolute;z-index:3;bottom:-2px;inset-inline-end:-2px;width:30px;height:30px;padding:6px;border-radius:50%;background:var(--rose);stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;display:none}
.tile.muted .mi{display:block}.tile.muted .av b{filter:grayscale(.6) brightness(.8)}
.dock{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.7rem;padding-top:.8rem}
.ctl{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);border-radius:99px;padding:.75rem 1.3rem;cursor:pointer;font-weight:600;transition:background .15s,transform .15s}
.ctl:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.ctl svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl.off{background:var(--rose);color:#fff;border-color:transparent}
.ctl.on{background:var(--violet);color:#0b0e1f;border-color:transparent}
#leave{background:rgba(255,111,157,.16);border-color:rgba(255,111,157,.5);color:#ffb3cb}
#toast{position:fixed;bottom:5.5rem;left:50%;transform:translate(-50%,20px);background:var(--deep);border:1px solid var(--line);padding:.6rem 1.2rem;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){main#home{grid-template-columns:1fr}.hero h1{margin-top:.5rem}.body{flex-direction:column}.has-stage #grid{flex:0 0 auto;flex-direction:row;overflow-x:auto}.ctl span{display:none}}
@media(prefers-reduced-motion:reduce){.aurora i,.wave b{animation:none}}
#side{flex:0 0 260px;display:flex;flex-direction:column;gap:.7rem;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:.9rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-height:0}
.sec{font-size:.8rem;color:var(--dim)}
#chans{overflow:auto;flex:1 1 55%;min-height:80px}#chans .sec{display:block;margin:.7rem 0 .2rem}
.ch{width:100%;display:flex;align-items:center;gap:.5rem;background:none;border:0;padding:.4rem .5rem;border-radius:10px;cursor:pointer;text-align:start;font-weight:600}
.ch:hover{background:rgba(255,255,255,.07)}.ch.cur{color:var(--mint);background:rgba(94,234,212,.1)}
.ch em{margin-inline-start:auto;font-style:normal;font-size:.8rem;color:var(--dim)}
#chans ul{list-style:none;padding:0 1.4rem .3rem;font-size:.85rem;color:var(--dim)}
#newr,#cf{display:flex;gap:.4rem}
#newr input,#cf input{margin:0;padding:.45rem .7rem;font-size:.85rem}
#newr button{border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:0 .8rem;cursor:pointer}
#chat{flex:1;min-height:0;display:flex;flex-direction:column;gap:.5rem}
#msgs{flex:1;overflow:auto;font-size:.88rem;display:flex;flex-direction:column;gap:.3rem}
#msgs p{word-break:break-word}#msgs b{color:var(--violet);margin-inline-end:.5rem}#msgs p.me b{color:var(--mint)}
.react{display:flex;gap:.2rem}
.react button{border:1px solid var(--line);background:var(--glass);border-radius:99px;width:42px;height:42px;font-size:1.15rem;cursor:pointer;transition:transform .15s}
.react button:hover{transform:scale(1.18)}
.fl{position:absolute;top:0;left:50%;font-size:1.8rem;transform:translate(-50%,0);animation:fl 1.6s ease-out forwards;pointer-events:none;z-index:5}
@keyframes fl{to{transform:translate(-50%,-80px);opacity:0}}
.vol{width:90px;height:14px;margin:0!important;padding:0!important;border:0!important;background:none!important;opacity:0;transition:opacity .15s;accent-color:var(--mint)}
.tile:hover .vol,.vol:focus-visible{opacity:1}
.sbtn{display:none;margin-inline-start:0}
@media(hover:none){.vol{opacity:1}}
@media(max-width:760px){#side{position:fixed;top:0;bottom:0;left:0;z-index:20;width:min(86vw,300px);border-radius:0 18px 18px 0;background:var(--deep);transform:translateX(-105%);transition:transform .25s}#side.open{transform:none}.sbtn{display:inline-block}.react{display:none}}
.hero{display:grid;justify-items:start;gap:1.6rem;padding-top:1rem}
.orb{position:relative;width:170px;height:170px}
.orb b{position:absolute;inset:38px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--mint));box-shadow:0 0 60px rgba(94,234,212,.35)}
.orb i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--mint);opacity:0;animation:ring 3.6s ease-out infinite}
.orb i:nth-child(2){animation-delay:1.2s}.orb i:nth-child(3){animation-delay:2.4s}
@keyframes ring{from{transform:scale(.55);opacity:.7}to{transform:scale(1.25);opacity:0}}
.credit{font-size:clamp(1.9rem,4.6vw,3.1rem);font-weight:800;line-height:1.35}
.hero .wave{margin-top:0}
.who{display:flex;gap:.9rem;align-items:flex-end}.grow{flex:1}.up{cursor:pointer}
#avp{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--dim);font-size:1.6rem;color:var(--dim);background-size:cover;background-position:center;transition:border-color .15s}
.up:hover #avp{border-color:var(--mint);color:var(--mint)}
.opt{display:flex;align-items:center;gap:.8rem;font-size:.85rem;color:var(--dim)}
#sw{display:flex;gap:.5rem}#sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
#sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink)}
select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:.7rem 1rem;margin-top:.3rem;font-size:.95rem;font-family:inherit}
select option{background:var(--deep)}
.clip{display:grid;place-items:center;width:38px;flex:0 0 38px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--dim)}
.clip:hover{color:var(--mint);border-color:var(--mint)}
.clip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#msgs img{max-width:100%;border-radius:10px;margin-top:.3rem;display:block}
#msgs a{color:var(--mint);word-break:break-all}
@media(prefers-reduced-motion:reduce){.orb i{animation:none}}
#bgl{position:fixed;inset:0;z-index:-1;display:grid;place-items:center;overflow:hidden}
#bgw{font-weight:800;opacity:.28;text-align:center;line-height:1.25;padding:0 6vw;max-width:100%;word-break:break-word;pointer-events:none}
#dz{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,7,18,.55);backdrop-filter:blur(4px)}
.dzp{width:min(92vw,420px);max-height:90vh;overflow:auto;display:grid;gap:.8rem;background:var(--deep)}
.dzh{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.dzh button{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--dim)}
#bgs{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
#bgs button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer}
#bgs button.on{border-color:#fff}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.row select{margin:0;flex:1}
.ctl2{border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:.5rem .9rem;cursor:pointer;font-size:.88rem;text-align:center}
.ctl2:hover{border-color:var(--mint)}
#dim{margin:.3rem 0 0;padding:0;border:0;background:none;accent-color:var(--mint)}
#wc{display:flex;gap:.5rem}#wc button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
#wc button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink)}
.sech{display:flex;align-items:center;justify-content:space-between}
#addr{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:.25rem .8rem;font-size:.82rem;cursor:pointer;color:var(--mint)}
#addr:hover{border-color:var(--mint)}
#status{background:none;border:0;cursor:pointer}
#status.bad:before,#net.bad:before{background:var(--rose);box-shadow:0 0 10px var(--rose)}
#net{display:inline-flex;align-items:center;gap:.5rem}
#net:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
#dg{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,7,18,.55);backdrop-filter:blur(4px)}
#dgt{direction:ltr;text-align:left;white-space:pre-wrap;font:12px/1.7 ui-monospace,Menlo,monospace;max-height:50vh;overflow:auto}
#lobby{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.6rem;padding:3vh 1rem;overflow:auto}
#mk{display:flex;gap:.6rem;width:min(100%,520px)}
#mk input{margin:0;font-size:1.05rem;padding:.9rem 1.1rem}
#mk button{border:0;border-radius:14px;padding:0 1.5rem;font-weight:800;cursor:pointer;color:#0b0e1f;background:linear-gradient(120deg,var(--mint),var(--violet))}
#lobrooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;width:min(100%,900px)}
.card{display:grid;gap:.4rem;text-align:start;position:relative;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem;cursor:pointer;backdrop-filter:blur(14px);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--mint)}
.card .cn{font-weight:800;font-size:1.1rem}.card .cm{color:var(--dim);font-size:.85rem}
.card em{position:absolute;top:.9rem;inset-inline-end:1rem;font-style:normal;background:var(--mint);color:#0b0e1f;border-radius:99px;min-width:1.7rem;text-align:center;font-weight:800;font-size:.85rem}
#call.lob #side,#call.lob .dock,#call.lob #grid,#call.lob #stage,#call.lob #invite,#call.lob #sbtn{display:none!important}
#call:not(.lob) #lobby,#call:not(.lob) #bye{display:none}
.aurora .pulse{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 75%,rgba(94,234,212,.4),transparent 70%);opacity:calc(var(--amb,0)*.85);transition:opacity .12s}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:.45rem}
.mm{display:flex;flex-wrap:wrap;gap:.35rem}
.mp{font-size:.8rem;color:var(--dim);background:rgba(0,0,0,.25);border-radius:99px;padding:.1rem .65rem}
#msgs p.sys{color:var(--dim);font-size:.8rem}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.body.swap{animation:swap .4s ease}
#tmr{color:var(--mint)}
.ctl.on{background:var(--violet);color:#0b0e1f;border-color:transparent}
#ver{position:fixed;bottom:.5rem;left:.8rem;font-size:.7rem;color:var(--dim);opacity:.5;pointer-events:none;direction:ltr}
#hint{position:fixed;top:4.4rem;left:50%;transform:translateX(-50%);width:min(92vw,520px);display:flex;gap:.8rem;align-items:flex-start;background:var(--deep);border:1px solid var(--rose);border-radius:14px;padding:.7rem 1rem;z-index:25;font-size:.88rem}
#hint button{background:none;border:0;color:var(--dim);cursor:pointer;margin-inline-start:auto}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><b class="pulse"></b></div>
<div id="bgl" aria-hidden="true" hidden><div id="bgw"></div></div>
<div id="home">
<header class="top">
 <div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs><path d="M6 13v6M11 8v16M16 4v24M21 9v14M26 13v6"/></svg>محمدی اسپیک</div>
 <button id="status" type="button">در حال اتصال…</button>
</header>
<main style="display:contents">
<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:2.2rem;max-width:980px;margin:0 auto;padding:2vh 1.4rem 3rem;align-items:start" class="grid2">
 <section class="hero"><div class="orb" aria-hidden="true"><i></i><i></i><i></i><b></b></div><div class="credit">تهیه شده توسط آقای محمدی</div><div class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></section>
 <section class="panel">
  <form id="join" autocomplete="off">
   <div class="who"><label class="up" aria-label="آپلود عکس پروفایل"><input type="file" id="avf" accept="image/*" hidden><span id="avp">+</span></label><label class="grow">اسم تو<input id="name" maxlength="20" placeholder="مهندس"></label></div>
   <div class="opt"><span>رنگ</span><div id="sw"></div></div>
   <label>کیفیت اشتراک صفحه<select id="q"><option value="720">۷۲۰ — سبک</option><option value="1080">۱۰۸۰</option><option value="1080-60">۱۰۸۰ — ۶۰ فریم</option></select></label>
   <button id="go" type="submit">ورود</button>
  </form>
 </section>
</div>
</main>
</div>
<div id="call" hidden>
 <div class="bar"><div><div class="rt" id="rname"></div><small id="cnt"></small> <small id="tmr"></small></div><button class="pill" id="net" type="button" style="margin-inline-start:0">…</button><button class="pill sbtn" id="sbtn">روم‌ها</button><button class="pill" id="bye" type="button">تغییر نام</button><button class="pill" id="invite">کپی لینک دعوت</button></div>
 <div class="body"><div id="lobby"><form id="mk" autocomplete="off"><input maxlength="40" placeholder="اسم روم جدید" aria-label="اسم روم جدید"><button>ساخت روم</button></form><div id="lobrooms"></div></div><div id="grid"></div><div id="stage" hidden></div>
  <aside id="side"><div class="sec">روم‌ها</div>
   <form id="newr" autocomplete="off"><input maxlength="40" placeholder="اسم روم جدید" aria-label="اسم روم جدید"><button>ساخت</button></form>
   <div id="chans"></div>
   <div id="chat"><div class="sec">چت</div><div id="msgs"></div><form id="cf" autocomplete="off"><label class="clip" aria-label="ارسال فایل"><input type="file" id="ff" hidden><svg viewBox="0 0 24 24"><path d="M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 8"/></svg></label><input maxlength="300" placeholder="پیام" aria-label="پیام"></form></div>
  </aside></div>
